name: Publish KRIPTOBIO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify presentation
        run: node verify-3d.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/models _site/vendor
          cp index.html experience.js experience.css ATTRIBUTION.txt .nojekyll _site/
          cp models/anatomy-data.js models/skin-data.js models/LICENSE-MODEL.txt models/LICENSE-SKIN.txt models/SKIN-NOTICES.md _site/models/
          cp vendor/three.offline.js vendor/LICENSE-THREE.txt _site/vendor/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
